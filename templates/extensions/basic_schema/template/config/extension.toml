[package]
title = "{{ extension_display_name }}"
version = "{{ version }}"  # Semantic Versionning is used: https://semver.org/
description = "The simplest schema extension example. Use it as a starting point for your extensions."
category = "Schema"  # How to categorize this in the Extension Manager
changelog = "docs/CHANGELOG.md"
icon = "data/icon.png"  # Icon to show in the Extension Manager
keywords = ["eca", "schema", "extension"]  # Search keywords for the Extension Manager
preview_image = "data/preview.png"  # Preview to show in the Extension Manager
readme  = "docs/README.md"  # Path (relative to the root) or content of readme markdown file for UI
repository = "https://github.com/NVIDIA-Omniverse/kit-app-template"  # URL of the extension source repository

[core]
reloadable = false
order = -100

[dependencies]
"omni.usd.libs" = {}

[[python.module]]
name = "{{ extension_name }}"

[[python.module]]
name = "{{ schema_python_module }}"

[[native.library]]
"filter:platform"."windows-x86_64"."path" = "bin/${lib_prefix}{{ schema_name }}${lib_ext}"
"filter:platform"."linux-x86_64"."path" = "lib/${lib_prefix}{{ schema_name }}${lib_ext}"

[[repo.plug.native]]
"filter:platform"."windows-x86_64"."path" = "bin"
"filter:platform"."linux-x86_64"."path" = "lib"

[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
]


[[test]]
dependencies = [
]

args = [
]